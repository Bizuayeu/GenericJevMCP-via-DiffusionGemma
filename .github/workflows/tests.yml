name: CPU and MCP tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - name: Fetch pinned tokenizer only
        run: |
          python - <<'PY'
          import json, shutil
          from huggingface_hub import hf_hub_download
          m = json.load(open('models.lock.json'))['diffusion']
          shutil.copyfile(hf_hub_download(m['model'], 'tokenizer.json', revision=m['revision']), 'tests/tokenizer.json')
          PY
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
